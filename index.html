<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOHUM</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-family='Roboto, Arial, sans-serif' font-size='60' font-weight='900' fill='%23f7f6f3' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Doppio+One&family=Roboto:wght@300;400;500;700;900&display=block"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Doppio+One&family=Roboto:wght@300;400;500;700;900&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-title">VOHUM</h1>
      <div class="header-controls">
        <div class="view-toggle" id="viewToggle" role="group" aria-label="View">
          <button
            type="button"
            class="toggle-option active"
            data-view="spatial"
            aria-label="Spatial view"
          >
            <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true">
              <rect x="1" y="2" width="4" height="4"></rect>
              <rect x="8" y="1" width="3" height="3"></rect>
              <rect x="13" y="6" width="4" height="4"></rect>
              <rect x="3" y="11" width="3" height="3"></rect>
              <rect x="10" y="13" width="4" height="4"></rect>
            </svg>
          </button>
          <button
            type="button"
            class="toggle-option"
            data-view="grid"
            aria-label="Grid view"
          >
            <svg viewBox="0 0 18 18" width="16" height="16" aria-hidden="true">
              <rect x="1" y="1" width="4" height="4"></rect>
              <rect x="7" y="1" width="4" height="4"></rect>
              <rect x="13" y="1" width="4" height="4"></rect>
              <rect x="1" y="7" width="4" height="4"></rect>
              <rect x="7" y="7" width="4" height="4"></rect>
              <rect x="13" y="7" width="4" height="4"></rect>
              <rect x="1" y="13" width="4" height="4"></rect>
              <rect x="7" y="13" width="4" height="4"></rect>
              <rect x="13" y="13" width="4" height="4"></rect>
            </svg>
          </button>
        </div>
        <a class="menu-btn" id="menuBtn" href="about.html">About</a>
      </div>
    </header>

    <main>
      <section
        id="spatialView"
        class="view spatial-view active"
        aria-label="Collection, spatial view"
      >
        <div class="spatial-canvas" id="spatialCanvas"></div>
        <!-- FX toggle disabled while we're only using FX02 (Sphere) — FX01
             (Orbit) is still implemented in js/layouts.js, just not exposed.
        <div class="fx-switcher" id="fxSwitcher">
          <span class="fx-label">FX</span>
          <button type="button" class="fx-btn active" data-fx="0">01</button>
          <button type="button" class="fx-btn" data-fx="1">02</button>
        </div>
        -->
      </section>

      <section
        id="gridView"
        class="view grid-view"
        aria-label="Collection, grid view"
      >
        <div class="grid-canvas" id="gridCanvas"></div>
      </section>
    </main>

    <div class="modal-overlay" id="itemModal">
      <div class="modal" id="modalDialog" role="dialog" aria-modal="true">
        <button
          type="button"
          class="modal-close"
          id="modalClose"
          aria-label="Close"
        >
          &times;
        </button>
        <div class="modal-image-wrap">
          <button
            type="button"
            class="modal-nav modal-nav-prev"
            id="modalPrev"
            aria-label="Previous image"
          >
            &lsaquo;
          </button>
          <img id="modalImage" src="" alt="" />
          <button
            type="button"
            class="modal-nav modal-nav-next"
            id="modalNext"
            aria-label="Next image"
          >
            &rsaquo;
          </button>
          <div class="modal-dots" id="modalDots"></div>
        </div>
        <div class="modal-info">
          <p class="sold-out-note">Contact for availability</p>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/layouts.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
